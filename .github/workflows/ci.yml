name: CI

on:
  push:
    branches: [develop, main, backend, modification]
  pull_request:
    branches: [develop, main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run init SQL scripts
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/01_create_schema.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/02_reference_data.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/03_fact_routes_data.sql || true

      - name: Run tests
        working-directory: ./backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5434
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run init SQL scripts
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/01_create_schema.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/02_reference_data.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/03_fact_routes_data.sql || true

      - name: Start backend
        working-directory: ./backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5434
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8002 &
          sleep 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8002/api/v1
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # Étape 4 — Construction des images Docker (valide que les Dockerfiles buildent).
  build-images:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image backend
        run: docker build -t obrail-backend:ci ./backend

      - name: Build de l'image frontend
        run: docker build -t obrail-frontend:ci ./frontend

  # Étape 5 — Déploiement simulé : lance toute la stack via docker compose
  # et vérifie qu'elle démarre et répond (smoke test d'intégration).
  deploy-test:
    name: Déploiement simulé (docker compose)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Créer le fichier .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          GRAFANA_USER=admin
          GRAFANA_PASSWORD=admin
          EOF

      - name: Lancer la stack (docker compose up)
        run: docker compose up -d --build

      - name: Attendre que le backend soit opérationnel
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/api/v1/health > /dev/null; then
              echo "✅ Backend opérationnel"; exit 0
            fi
            echo "Attente du backend ($i/30)..."; sleep 5
          done
          echo "❌ Backend indisponible"; docker compose logs backend; exit 1

      - name: Vérifier que le frontend répond
        run: |
          curl -sf http://localhost:3001 > /dev/null && echo "✅ Frontend répond"

      - name: État des conteneurs
        if: always()
        run: docker compose ps

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  # Étape 6 — Rapport de succès/échec du pipeline (résumé lisible).
  report:
    name: Rapport CI
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-e2e, build-images, deploy-test]
    if: always()
    steps:
      - name: Générer le résumé
        run: |
          {
            echo "## 📋 Rapport CI — ObRail"
            echo ""
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "| 2. Tests backend (pytest) | ${{ needs.test-backend.result }} |"
            echo "| 1+. Tests frontend (lint/type/build) | ${{ needs.test-frontend.result }} |"
            echo "| 3. Tests E2E (Playwright) | ${{ needs.test-e2e.result }} |"
            echo "| 4. Build images Docker | ${{ needs.build-images.result }} |"
            echo "| 5. Déploiement simulé | ${{ needs.deploy-test.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Statut global
        run: |
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ] || \
             [ "${{ needs.deploy-test.result }}" != "success" ]; then
            echo "❌ Pipeline en échec"
            exit 1
          fi
          echo "✅ Pipeline réussi"