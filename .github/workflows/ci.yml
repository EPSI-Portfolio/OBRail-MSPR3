# CI pipeline for ObRail project

name: CI

on:
  push:
    branches: [develop, main, backend, modification]
  pull_request:
    branches: [develop, main]

jobs:
  
  # 1. Backend tests — runs pytest against a real Postgres service container
  
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5   
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run init SQL scripts
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/01_create_schema.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/02_reference_data.sql
          psql -h localhost -p 5434 -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -f database/init/03_fact_routes_data.sql || true

      - name: Run tests
        working-directory: ./backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5434
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: pytest tests/ -v

  
  # 2. Frontend checks — lint, type-check, build
  
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build


  # 3. End-to-end tests — spin up the stack, run Playwright against it

  test-e2e:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          GRAFANA_USER=${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          EOF

      - name: Start backend + frontend + db
        run: docker compose up -d --build db backend frontend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for frontend to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then echo "frontend up"; break; fi
            echo "waiting for frontend... ($i)"; sleep 3
          done

      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test

      - name: Teardown
        if: always()
        run: docker compose down -v

  # 4. Build images — validate the Dockerfiles build cleanly

  build-images:
    needs: [test-backend, test-frontend, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t obrail-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t obrail-frontend:ci


  # 5. Deploy-test — simulated deployment + smoke test, then tear down

  deploy-test:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          GRAFANA_USER=${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          EOF

      - name: Simulated deployment (docker compose up)
        run: docker compose up -d --build

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/api/v1/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            echo "waiting for backend... ($i)"; sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1

      - name: Teardown
        if: always()
        run: docker compose down -v

 
  # 6. Report — always runs, summarises every job into the run summary

  report:
    needs: [test-backend, test-frontend, test-e2e, build-images, deploy-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend tests | ${{ needs.test-backend.result }} |"
            echo "| Frontend tests | ${{ needs.test-frontend.result }} |"
            echo "| E2E tests | ${{ needs.test-e2e.result }} |"
            echo "| Build images | ${{ needs.build-images.result }} |"
            echo "| Deploy (simulated) | ${{ needs.deploy-test.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"