services:

  # PostgreSQL 15 database. Stores all train route and CO2 data.
  # Init scripts in ./database/init run automatically on first start.
  db:
    image: postgres:15
    container_name: obrail-mspr3_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - obrail-net

  # FastAPI backend. Exposes the REST API on port 8002 and /metrics for Prometheus.
  # Waits for the database to be healthy before starting.
  # Writes structured JSON logs to the shared backend_logs volume (read by Promtail).
  backend:
    build: ./backend
    container_name: obrail-mspr3_api
    ports:
      - "8002:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - obrail-net

  # React Vite frontend. Serves the UI on port 3001.
  # Built from ./frontend/Dockerfile.
  # Calls the backend API via VITE_API_URL environment variable.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://backend:8000/api/v1
    container_name: obrail-mspr3_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - obrail-net

  # Prometheus scrapes /metrics from the backend every 15 seconds.
  # Configuration is defined in ./monitoring/prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    container_name: obrail-mspr3_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    networks:
      - obrail-net

  # Loki stores and indexes the application logs. Receives them from Promtail
  # and exposes them to Grafana on port 3100. Uses Loki's built-in dev config.
  loki:
    image: grafana/loki:2.9.0
    container_name: obrail-mspr3_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - obrail-net

  # Promtail tails the backend's JSON logs (shared volume) and ships them to Loki.
  # Configuration is defined in ./monitoring/promtail/promtail-config.yml.
  promtail:
    image: grafana/promtail:2.9.0
    container_name: obrail-mspr3_promtail
    volumes:
      - backend_logs:/var/log/backend:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - backend
    networks:
      - obrail-net

  # Grafana visualises metrics from Prometheus and logs from Loki on port 3000.
  # Datasources and dashboards are auto-provisioned from ./monitoring/grafana/.
  # Admin credentials are loaded from .env and never hardcoded.
  grafana:
    image: grafana/grafana:latest
    container_name: obrail-mspr3_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - obrail-net

# All services share an explicit, named network so they can reach each other
# by service name (e.g. the backend reaches the db at host "db").
networks:
  obrail-net:
    driver: bridge

volumes:
  # Persists PostgreSQL data between container restarts.
  postgres_data:
  # Persists Grafana dashboards and settings between container restarts.
  grafana_data:
  # Shares the backend's JSON log files with Promtail.
  backend_logs:
