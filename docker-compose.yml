services:

  db:
    image: postgres:15
    container_name: obrail-mspr3_postgres_db
    environment:
      POSTGRES_USER: obrail_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: obrail_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obrail_user -d obrail_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: obrail-mspr3_api
    ports:
      - "8002:8000"
    environment:
      POSTGRES_USER: obrail_user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: obrail_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: